spring:
  application:
    name: ai-ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-please-use-32+chars}
    expiration-ms: 86400000
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: /files
  cors:
    allowed-origins: http://localhost:4200,http://localhost:10581,http://localhost:4201,http://localhost:3000

ai:
  provider: ${AI_PROVIDER:mock}
  vertex:
    project: ${GOOGLE_CLOUD_PROJECT:}
    location: ${VERTEX_LOCATION:us-central1}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    embedding-model: multimodalembedding@001
    text-model: gemini-1.5-flash

springdoc:
  swagger-ui:
    path: /swagger-ui.html
