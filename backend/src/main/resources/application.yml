spring:
  application:
    name: ai-ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-bigdecimal-as-plain: true
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:please-replace-with-32-plus-char-random-secret-key}
    expiration-ms: 86400000
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: /files
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  bootstrap:
    use-deterministic-vectors: ${USE_DETERMINISTIC_VECTORS:false}

ai:
  provider: ${AI_PROVIDER:mock}
  vertex:
    project: ${GOOGLE_CLOUD_PROJECT:}
    location: ${VERTEX_LOCATION:us-central1}
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    embedding-model: multimodalembedding@001
    text-model: gemini-1.5-flash

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ahmed.ecommerce: DEBUG
    org.hibernate.SQL: WARN
